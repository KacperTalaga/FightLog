<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>FightLog</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <header class="app-header">
        <span class="app-header__logo">FIGHT<em>LOG</em></span>
    </header>

    <main class="app-main">
        <section id="view-plan" class="view is-active" aria-label="Plan"></section>
        <section id="view-log" class="view" aria-label="Log"></section>
        <section id="view-progress" class="view" aria-label="Progresja"></section>
        <section id="view-diet" class="view" aria-label="Dieta"></section>
        <section id="view-knowledge" class="view" aria-label="Baza wiedzy"></section>
    </main>

    <nav class="tab-bar" aria-label="Nawigacja główna">
        <button class="tab-bar__btn is-active" type="button" data-view="plan" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M8 3v4M16 3v4M3 10h18"></path>
            </svg>
            Plan
        </button>
        <button class="tab-bar__btn" type="button" data-view="log" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="4" width="16" height="17" rx="2"></rect>
                <path d="M9 3h6v3H9z"></path>
                <path d="M8.5 13l2.5 2.5 4.5-4.5"></path>
            </svg>
            Log
        </button>
        <button class="tab-bar__btn" type="button" data-view="progress" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 17 9 11 13 15 21 7"></polyline>
                <polyline points="15 7 21 7 21 13"></polyline>
            </svg>
            Progresja
        </button>
        <button class="tab-bar__btn" type="button" data-view="diet" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 18a8 8 0 1 1 16 0"></path>
                <path d="M12 18l4-6"></path>
                <path d="M3 21h18"></path>
            </svg>
            Dieta
        </button>
        <button class="tab-bar__btn" type="button" data-view="knowledge" aria-current="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"></path>
                <path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"></path>
            </svg>
            Wiedza
        </button>
    </nav>
</body>
</html>
